<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#10243c"><meta name="description" content="Reset your TEK.Go password."><title>Forgot Password | TEK.Go</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css"></head><body>

<main class="subpage-main"><div class="subpage-wrap"><span class="subpage-kicker">Account recovery</span><h1 class="subpage-title">Reset your password.</h1><p class="subpage-lead">Enter your registered work email and we’ll request a secure reset link.</p><section class="subpage-card subpage-form"><form id="reset-request-form"><label for="reset-email">Work email</label><input id="reset-email" type="email" autocomplete="email" required placeholder="you@company.com"><button class="subpage-action" id="reset-submit" type="submit">Send reset link →</button><p id="reset-status" class="subpage-status" role="status" aria-live="polite"></p></form><div class="subpage-links"><a href="index.html" target="_blank" rel="noopener">Back to sign in</a><a href="help.html" target="_blank" rel="noopener">Help centre</a></div></section></div></main><footer class="page-footer">TEK.Go · Your account security matters.</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" crossorigin="anonymous"></script><script src="supabase-config.js"></script><script>
const form=document.querySelector("#reset-request-form"),status=document.querySelector("#reset-status"),button=document.querySelector("#reset-submit");
function message(text){status.textContent=text;status.classList.add("visible")}
form.addEventListener("submit",async event=>{event.preventDefault();if(!window.tekGoSupabaseClients){message(window.tekGoSupabaseError||"Password recovery is unavailable. Contact your administrator.");return}button.disabled=true;button.textContent="Sending…";try{const email=document.querySelector("#reset-email").value.trim();const client=window.tekGoSupabaseClients.temporary;const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo:new URL("reset-password.html",window.location.href).href});if(error)throw error;message("If this email belongs to an active account, a password-reset link will be sent. Check your inbox and spam folder.")}catch{message("The reset request could not be completed. Check the email address or contact your administrator.")}finally{button.disabled=false;button.textContent="Send reset link →"}});
</script></body></html>
