<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#10243c"><title>Choose a New Password | TEK.Go</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css"></head><body>

<main class="subpage-main"><div class="subpage-wrap"><span class="subpage-kicker">Account recovery</span><h1 class="subpage-title">Choose a new password.</h1><p class="subpage-lead">Open this page from the secure password-reset email sent by TEK.Go.</p><section class="subpage-card subpage-form"><form id="new-password-form"><label for="new-password">New password</label><input id="new-password" type="password" autocomplete="new-password" minlength="8" required><label for="confirm-password">Confirm new password</label><input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required><button class="subpage-action" id="save-password" type="submit">Update password →</button><p id="new-password-status" class="subpage-status" role="status" aria-live="polite"></p></form><div class="subpage-links"><a href="index.html" target="_blank" rel="noopener">Back to sign in</a></div></section></div></main><footer class="page-footer">TEK.Go · Keep your password private.</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" crossorigin="anonymous"></script><script src="supabase-config.js"></script><script>
const form=document.querySelector("#new-password-form"),status=document.querySelector("#new-password-status"),button=document.querySelector("#save-password");
function message(text){status.textContent=text;status.classList.add("visible")}
form.addEventListener("submit",async event=>{event.preventDefault();const password=document.querySelector("#new-password").value,confirm=document.querySelector("#confirm-password").value;if(password!==confirm){message("The passwords do not match.");return}if(!window.tekGoSupabaseClients){message(window.tekGoSupabaseError||"Password updates are unavailable. Contact your administrator.");return}button.disabled=true;button.textContent="Updating…";try{const client=window.tekGoSupabaseClients.temporary;const {error}=await client.auth.updateUser({password});if(error)throw error;message("Your password has been updated. Open the sign-in page in a new tab to continue.");form.reset()}catch{message("The reset link may have expired. Request a new password-reset email and try again.")}finally{button.disabled=false;button.textContent="Update password →"}});
</script></body></html>
